apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher
  namespace: cattle-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher
  template:
    metadata:
      labels:
        app: rancher
    spec:
      securityContext:           # <-- Pod-level security context
        fsGroup: 1000            # gives all containers permission to write to volume
      containers:
      - name: rancher
        image: rancher/rancher:latest
        ports:
        - containerPort: 80
        - containerPort: 443
        securityContext:
          privileged: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: rancher-data
          mountPath: /var/lib/rancher
      volumes:
      - name: rancher-data
        hostPath:
          path: /opt/rancher-data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rancher
  namespace: cattle-system
spec:
  type: NodePort
  selector:
    app: rancher
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  - port: 443
    targetPort: 443
    nodePort: 30443